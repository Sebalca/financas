<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanças Pessoais</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#18202b;--mu:#667085;--bd:#e2e5ea;--ac:#2451d6;--ac2:#e9eefc;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1217;--card:#161b22;--tx:#e7eaef;--mu:#95a0b1;--bd:#29313c;--ac:#7d9bff;--ac2:#1c2740;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;height:48px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.brand{font-weight:800;font-size:15px;white-space:nowrap;letter-spacing:-.01em}
.brand span{color:var(--ac)}
nav{display:flex;gap:4px;height:100%}
nav a{display:flex;align-items:center;padding:0 14px;color:var(--mu);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--tx)}
nav a.on{color:var(--ac);border-bottom-color:var(--ac)}
.frames{flex:1;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.frames iframe.on{display:block}
@media (max-width:520px){.bar{gap:6px;padding:0 10px;height:44px}.brand{font-size:13px}nav a{padding:0 8px;font-size:13px}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Finanças <span>Pessoais</span></div>
  <nav id="tabs" role="tablist"></nav>
</div>
<div class="frames" id="frames"></div>
<script>
/* Para adicionar um separador: acrescentar {id, nome, ficheiro} a esta lista e criar o HTML na mesma pasta. */
const SEPARADORES=[
  {id:'simulador', nome:'Simulador Salarial', ficheiro:'simulador-salarial.html'},
  {id:'financas',  nome:'Finanças',           ficheiro:'financas.html'}
];
const tabs=document.getElementById('tabs'),frames=document.getElementById('frames');
SEPARADORES.forEach(s=>{
  const a=document.createElement('a');a.href='#'+s.id;a.textContent=s.nome;a.dataset.id=s.id;a.setAttribute('role','tab');tabs.appendChild(a);
});
function abrir(id){
  const s=SEPARADORES.find(x=>x.id===id)||SEPARADORES[0];
  let f=frames.querySelector(`iframe[data-id="${s.id}"]`);
  if(!f){f=document.createElement('iframe');f.dataset.id=s.id;f.title=s.nome;f.src=s.ficheiro;frames.appendChild(f)} // carrega só quando é aberto e mantém o estado
  frames.querySelectorAll('iframe').forEach(x=>x.classList.toggle('on',x===f));
  tabs.querySelectorAll('a').forEach(a=>{const on=a.dataset.id===s.id;a.classList.toggle('on',on);a.setAttribute('aria-selected',on)});
  document.title=s.nome+' · Finanças Pessoais';
}
window.addEventListener('hashchange',()=>abrir(location.hash.slice(1)));
abrir(location.hash.slice(1));
</script>
</body>
</html>
